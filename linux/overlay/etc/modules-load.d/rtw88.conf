# Loaded at boot by /etc/init.d/S11modules (which reads /etc/modules-load.d/*.conf
# -- NOT /etc/modules, which this image ignores entirely).
#
# rtw88_8821cu drives the RTL8811CU/RTL8821CU dual-band USB adapter
# (0bda:c811), fitted 2026-09-13 to replace the 2.4GHz-only RTL8192EU.
# The old card was stuck on a channel with seven co-channel BSSes and had
# fallen back to 1.0 Mbit/s RX, which cost two epoch boundaries -- the
# bitstream pushes kept failing mid-transfer. On 5 GHz the same link runs
# at 390 Mbit/s, -35 dBm, 0% loss.
#
# This must load here rather than relying on S45wifi's WIFI_MODULES_FALLBACK
# list: that loop only runs when the out-of-tree 8188eu.ko is ABSENT, so if
# that driver is ever reinstated the fallback is skipped and the board comes
# up with no network. Loading it here is unconditional. (It is also in the
# S45wifi list for defence; modprobe of a loaded module is a no-op.)
rtw88_8821cu
