# odod.conf — odo-miner pool configuration (sourced by /etc/init.d/S90odod)
# Set ODOD_POOL_HOST and ODOD_WORKER before first boot, or configure via
# the web dashboard at http://<board-ip> after the board comes up on Ethernet.
ODOD_POOL_HOST=
ODOD_POOL_PORT=3333
ODOD_WORKER=
ODOD_PASSWORD=x

# Optional backup pool, tried alternately when the primary is down
ODOD_POOL_HOST2=
ODOD_POOL_PORT2=

# Set to 1 for DigiByte testnet (1-day Odo epochs instead of 10-day)
ODO_TESTNET=0

# Hardware watchdog: when 1, odo-miner pets /dev/watchdog and a hung
# miner/kernel hard-reboots the board. Enable after the first soak test.
ODOD_WATCHDOG=0
