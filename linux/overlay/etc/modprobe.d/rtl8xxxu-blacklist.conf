# Prevent udev from auto-loading rtl8xxxu for RTL8188EU (0bda:818b).
# The lwfinger 8188eu out-of-tree driver handles power management correctly
# and avoids ~20 s DEAUTH cycles from spurious PS=1 frames in rtl8xxxu.
# S45wifi loads rtl8xxxu explicitly as a fallback if 8188eu is absent.
blacklist rtl8xxxu
