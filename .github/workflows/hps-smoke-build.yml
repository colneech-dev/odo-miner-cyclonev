name: Build HPS Smoke Test

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build smoke test
        working-directory: hps
        run: |
          make smoke_test

      - name: Upload fpga_smoke_test artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpga_smoke_test
          path: hps/fpga_smoke_test

  cross-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cross-toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf

      - name: Build ARM (armhf) smoke test
        working-directory: hps
        env:
          CC: arm-linux-gnueabihf-gcc
        run: |
          make smoke_test

      - name: Upload ARM artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpga_smoke_test-arm
          path: hps/fpga_smoke_test
